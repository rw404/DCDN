formulas:
  p_BLOCK_n_shows: count of history rows in the block
  p_BLOCK_n_shows_plus_beta: p_BLOCK_n_shows + beta
  p_BLOCK_sum_timespent: sum of timespent over the block
  p_BLOCK_sum_timespent_plus_alpha: p_BLOCK_sum_timespent + alpha
  p_BLOCK_n_ACTION_plus_alpha: count of ACTION over the block + alpha
  v_BLOCK_has_history: p_BLOCK_n_shows > 0
  e_BLOCK_ACTION_rate: p_BLOCK_n_ACTION_plus_alpha / p_BLOCK_n_shows_plus_beta
  e_BLOCK_avg_timespent: p_BLOCK_sum_timespent / p_BLOCK_n_shows when v_BLOCK_has_history else 0
  e_BLOCK_ACTION_per_second: p_BLOCK_n_ACTION_plus_alpha / p_BLOCK_sum_timespent_plus_alpha
