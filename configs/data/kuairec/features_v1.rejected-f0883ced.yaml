unit_normalization:
  provenance: official_KuaiRec_public_schema
  provenance_url: https://github.com/chongminggao/KuaiRec
  raw_units:
    big_matrix.play_duration: milliseconds
    big_matrix.video_duration: milliseconds
    item_daily_features.play_duration: milliseconds
  canonical_duration_units: seconds
  milliseconds_per_second: 1000.0
  positivity_filters_run_on_raw_milliseconds: true
  big_matrix_video_duration_to_c_and_P: raw_video_duration / 1000.0
  current_play_to_future_sealed_label: raw_play_duration / 1000.0
  lagged_daily_play_duration_to_P_and_E: cumulative_raw_milliseconds / 1000.0
  conversion_changes_filter_split_or_order: false

strict_exclusions:
  big_matrix.watch_ratio: label_derived_outcome_never_input_and_not_read_pre_unlock
  big_matrix.play_duration: current_label_source_or_blind_positive_filter_only
  big_matrix.time: redundant_audit_field_not_input
  big_matrix.date: audit_and_asof_key_only
  big_matrix.timestamp: audit_and_global_sort_key_only
  item_daily_features.play_progress: derived_statistic_not_a_base_operand
  item_daily_features.comment_stay_duration: ambiguous_aggregate_semantics_excluded
  item_daily_features.collect_cnt: source_wide_all_null_excluded_without_imputation
  item_daily_features.collect_user_num: source_wide_all_null_excluded_without_imputation
  item_daily_features.cancel_collect_cnt: source_wide_all_null_excluded_without_imputation
  item_daily_features.cancel_collect_user_num: source_wide_all_null_excluded_without_imputation
  user_features.csv: excluded_unknown_point_in_time_snapshot_provenance
  item_categories.csv.feat: excluded_ambiguous_multivalue_encoding
  caption_and_topic_text: excluded_unbounded_text_context
  small_matrix.csv: excluded_wrong_interaction_population
  social_network.csv: excluded_outside_frozen_feature_regime
  current_row_outcomes_as_history: forbidden
  same_day_item_daily_aggregates: forbidden

filtering:
  ordered_predicates:
    - static_video_type_is_not_AD
    - current_play_duration_gt_0
    - current_video_duration_gt_0
  duration_predicate_units: raw_milliseconds
  positive_watch_estimand_disclosed: true
  watch_ratio_read: false
  video_type_static_gate:
    normalization: strip_exact_string_no_case_fold
    invariant_required: one_nonmissing_value_per_video_across_daily_rows
    inconsistent_video_behavior: fail_before_split
    missing_video_type: UNK_and_keep
    ad_literal: AD
  numeric_parse_failure: fail_before_split
  deduplication: none_preserve_every_released_big_matrix_row

split:
  population: rows_after_all_frozen_filters
  sort_keys:
    - timestamp
    - user_id
    - video_id
    - source_row_index0
  source_row_index0: zero_based_data_row_excluding_header
  train_fraction: 0.8
  validation_fraction: 0.1
  test_fraction: 0.1
  rounding: train=floor(0.8*N); validation=floor(0.1*N); test=remainder
  mapping_fit_split: train_only
  validation_test_cold_user_item_policy: inner_drop_and_report_counts
  category_oov_policy: retain_row_and_map_to_OOV
  test_role: sealed_untouched_until_protocol_and_selected_configs_are_hashed

row_identity:
  formula: sha256(dataset_id NUL big_matrix_sha256 NUL source_row_index0)
  membership_hash_order: filtered_global_sort_order
  retain_audit_only:
    - stable_row_id
    - source_row_index0
    - original_user_id
    - original_video_id
    - timestamp
    - date
    - filtered_sorted_rank0
    - split
  audit_fields_are_model_inputs: false

context_C:
  fit_split: train_only_after_frozen_filters
  user_item_mapping:
    ordering: ascending_integer_id
    first_known_index: 0
    validation_test_unseen_behavior: inner_drop_before_evaluation
  category_mapping:
    source: kuairec_caption_category.csv
    fields:
      - first_level_category_id
      - second_level_category_id
      - third_level_category_id
    ordering: ascending_normalized_value
    OOV_index: 0
    first_known_index: 1
    missing_behavior: OOV
  fields:
    c_user_id: train_mapped_big_matrix.user_id
    c_video_id: train_mapped_big_matrix.video_id
    c_first_level_category_id: train_mapped_caption.first_level_category_id
    c_second_level_category_id: train_mapped_caption.second_level_category_id
    c_third_level_category_id: train_mapped_caption.third_level_category_id
  reciprocal_routing: bypass

daily_history:
