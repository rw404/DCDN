    - short_time_play_cnt
    - short_time_play_user_num
    - like_cnt
    - like_user_num
    - click_like_cnt
    - double_click_cnt
    - cancel_like_cnt
    - cancel_like_user_num
    - comment_cnt
    - comment_user_num
    - direct_comment_cnt
    - reply_comment_cnt
    - delete_comment_cnt
    - delete_comment_user_num
    - comment_like_cnt
    - comment_like_user_num
    - follow_cnt
    - follow_user_num
    - cancel_follow_cnt
    - cancel_follow_user_num
    - share_cnt
    - share_user_num
    - download_cnt
    - download_user_num
    - report_cnt
    - report_user_num
    - reduce_similar_cnt
    - reduce_similar_user_num

feature_algebra:
  P:
    p_video_duration_seconds: big_matrix.video_duration_raw_ms / 1000.0
    p_hist_play_duration_sum: cumulative_lagged_daily_play_duration_raw_ms / 1000.0
    lagged_daily_fields: cumulative_sum_over_same_video_and_daily_date_lt_event_date
    shifted_denominators:
      p_hist_show_cnt_plus_1: p_hist_show_cnt + 1
      p_hist_show_user_num_plus_1: p_hist_show_user_num + 1
      p_hist_play_cnt_plus_1: p_hist_play_cnt + 1
      p_hist_play_user_num_plus_1: p_hist_play_user_num + 1
  V:
    v_prior_daily_history_present: 1_if_any_daily_row_for_video_has_date_lt_d_else_0
    v_hist_show_cnt_nonzero: 1_if_p_hist_show_cnt_gt_0_else_0
    v_hist_show_user_num_nonzero: 1_if_p_hist_show_user_num_gt_0_else_0
    v_hist_play_cnt_nonzero: 1_if_p_hist_play_cnt_gt_0_else_0
    v_hist_play_user_num_nonzero: 1_if_p_hist_play_user_num_gt_0_else_0
    v_video_duration_positive: 1_after_frozen_positive_filter
  E:
    e_play_per_show: p_hist_play_cnt / p_hist_show_cnt_plus_1
    e_unique_play_per_unique_show: p_hist_play_user_num / p_hist_show_user_num_plus_1
    count_rate_template: >-
      For family in complete_play, valid_play, long_time_play,
      short_time_play: family_cnt/(play_cnt+1), family_cnt/(show_cnt+1),
      family_user_num/(play_user_num+1), and
      family_user_num/(show_user_num+1).
    e_average_play_duration_seconds: p_hist_play_duration_sum / p_hist_play_cnt_plus_1
    e_play_duration_per_show_seconds: p_hist_play_duration_sum / p_hist_show_cnt_plus_1
    engagement_rate_template: >-
      Every ordered engagement *_cnt source is divided by
      p_hist_show_cnt_plus_1; every *_user_num source is divided by
      p_hist_show_user_num_plus_1.
  smoothing_constant: 1.0
  smoothing_source: frozen_project_choice_before_raw_scan_not_metric_derived

normalization:
  fit_split: filtered_train_only
  numerical_P_and_E: divide_by_max(train_absolute_q99_linear_r7,1.0)
  validity_V: identity_zero_or_one
