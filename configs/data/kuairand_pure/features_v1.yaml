    synthetic_or_imputed_rows_forbidden: true
  embargo:
    role: owner_approved_boundary_embargo
    later_role_rows_retained: true
    earlier_role_rule: >-
      For each adjacent boundary, exclude an earlier-role row iff its time_ms
      is greater than or equal to the minimum time_ms of the next-role union.
    boundaries:
      history_to_train: history_burn_in_before_min_train_time_ms
      train_to_validation: train_before_min_validation_union_time_ms
      validation_to_test: validation_union_before_min_test_union_time_ms
    cutoff_inputs: date_time_ms_policy_source_file_and_source_row_index0_only
    cutoffs_time_ms:
      history_to_train: 1650552767170
      train_to_validation: 1651503652252
      validation_to_test: 1651762945505
    pre_embargo_rows_by_role:
      history_burn_in: 1141112
      headline_test: 322152
      in_policy_test: 43268
      pre_validation_randomized_excluded: 548567
      train: 202296
      validation: 315340
      validation_state_update_only: 49933
    excluded_rows_by_role:
      history_burn_in: 1204
      train: 976
      validation: 3850
      validation_state_update_only: 609
    post_embargo_rows_by_role:
      history_burn_in: 1139908
      headline_test: 322152
      in_policy_test: 43268
      pre_validation_randomized_excluded: 548567
      train: 201320
      validation: 311490
      validation_state_update_only: 49324
    total_excluded_rows: 6639
    excluded_rows_action: exclude_from_labels_state_updates_and_every_materialized_view
    labels_or_model_features_used: false

source_manifest:
  path: data/manifests/kuairand_pure_source_v1.yaml
  sha256: bc5b441fdd3188d033e0ecbf0bdfd73f8bcf07bbc744d474d260ee220ae4d6e9
  raw_archive_sha256: c814bf6f3624c0cfae83c57de3df26b2ed206e5c57bab4c4dcbfabbabe20cbf0

inspection_boundary:
  phase_1_allowed_columns:
    - date
    - time_ms
    - is_rand
  phase_1_allowed_audit_values:
    - source_file
    - source_row_index0
  phase_1_allowed_aggregates:
    - rows_by_source_policy_and_date
    - min_and_max_time_ms_by_source
    - split_policy_coverage_counts
    - minimum_time_ms_of_each_next_role_union
    - embargo_exclusion_counts_by_role
    - post_embargo_time_ms_bounds_by_role
  labels_or_model_features_read: false
  validation_or_test_metrics_read: false
  test_view_materialized: false

strict_exclusions:
  video_features_statistic_pure.csv: forbidden
  exclusion_reason: >-
    Released monthly statistics overlap the collection period and may include
    current or future outcomes.
  is_rand: audit_and_stratification_only
  current_row_outcomes:
    - comment_stay_time
    - duration_ms
    - is_click
    - is_comment
    - is_follow
    - is_forward
    - is_hate
    - is_like
    - is_profile_enter
    - long_view
    - play_time_ms
    - profile_stay_time
  current_row_outcome_use: label_or_post_score_state_update_only
  user_features_pure.csv: excluded_unknown_point_in_time_provenance
  excluded_video_basic_fields:
    upload_dt: excluded_until_upload_time_precedes_every_target_is_verified
    visible_status: excluded_unknown_point_in_time_snapshot
    server_width: excluded_nonessential_context
    server_height: excluded_nonessential_context
    tag: excluded_ambiguous_multivalue_encoding
    video_duration: excluded_to_avoid_mixing_static_and_event_duration_definitions

raw_event_contract:
  exact_column_order:
    - user_id
    - video_id
    - date
    - hourmin
    - time_ms
    - is_click
    - is_like
    - is_follow
    - is_comment
    - is_forward
    - is_hate
    - long_view
    - play_time_ms
    - duration_ms
    - profile_stay_time
    - comment_stay_time
    - is_profile_enter
    - is_rand
    - tab
  files:
    log_standard_4_08_to_4_21_pure.csv:
      policy: standard
      required_is_rand: 0
    log_standard_4_22_to_5_08_pure.csv:
      policy: standard
      required_is_rand: 0
    log_random_4_22_to_5_08_pure.csv:
      policy: randomized
      required_is_rand: 1
  source_row_index0: zero_based_data_row_excluding_header
  date_encoding: YYYYMMDD
  timestamp_encoding: integer_unix_milliseconds_utc
  released_date_authority: source_date_field_for_frozen_calendar_splits
  time_ms_authority: global_prequential_order_and_strict_feature_cutoff
  clock_relation_policy: report_released_date_minus_utc_date_without_coercion
  boundary_assertion: nonoverlapping_time_ms_between_train_validation_and_test

context_C:
  mapping_fit_rows: embargo_eligible_standard_policy_rows_2022-04-09_through_2022-05-02
  mapping_fit_excludes_randomized_rows: true
  encoding: categorical_index
  token_ids:
    OOV: 0
    MISSING: 1
    first_known: 2
  known_value_order: lexicographic_utf8_bytes
  retain_oov_rows: true
  fields:
    c_user_id: {source: event.user_id}
    c_video_id: {source: event.video_id}
    c_author_id: {source: video_features_basic_pure.author_id}
    c_tab: {source: event.tab}
