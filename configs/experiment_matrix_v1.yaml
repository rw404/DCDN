schema_version: 1
status: frozen_before_metrics
final_seeds: [42, 43, 44]
tuning_seed: 42
reuse_identical_cells: true

tier_a:
  datasets:
    kuairand_pure:
      primary_target: long_view
      full_feature_suffix: R
    vk_lsvd_up0.01_ir0.01:
      primary_target: normalized_watch_time
      full_feature_suffix: E
    kuairec_big_matrix:
      primary_target: normalized_watch_time
      full_feature_suffix: E
  rows:
    - model: dcnv2
      feature_regime: C+P
    - model: dcnv2
      feature_regime: C+P+E/R
