    - kuairand_pure
    - vk_lsvd_up0.01_ir0.01
  feature_regime: C+P
  primary_targets_only: true
  models:
    - dnn
    - deepfm
    - dcn
    - autoint_plus
    - dcnv2
    - afn_plus
    - wukong_small
    - dcdn_core

constraints:
  - do_not_run_architecture_zoo_on_kuairec
  - do_not_expand_tier_b_to_full_feature_regime
